<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImmoPixels Board</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #f4f2ef;
  --bg2:   #ffffff;
  --bg3:   #eeebe6;
  --bg4:   #e4e0d9;
  --border:#ddd9d2;
  --brd2:  #c8c3ba;
  --gold:  #b8892a;
  --gold2: #d4a845;
  --gdbg:  #b8892a14;
  --gdbr:  #b8892a35;
  --blue:  #1d5ec7;
  --bluebg:#1d5ec712;
  --bluebr:#1d5ec730;
  --green: #15803d;
  --grbg:  #15803d12;
  --grbr:  #15803d30;
  --red:   #b91c1c;
  --rdbg:  #b91c1c12;
  --rdbr:  #b91c1c30;
  --yel:   #a16207;
  --yelbg: #a1620712;
  --yelbr: #a1620730;
  --pur:   #6d28d9;
  --purbg: #6d28d912;
  --purbr: #6d28d930;
  --t1:    #1c1a16;
  --t2:    #4a4640;
  --t3:    #8a8278;
  --cw:    275px;
  --sh:    0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh2:   0 4px 20px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--t1);overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}

/* TOP */
.tb{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;flex-shrink:0;box-shadow:var(--sh)}
.tb-logo{display:flex;align-items:center;gap:10px;padding:0 18px;border-right:1px solid var(--border);height:100%}
.logo-mark{width:32px;height:32px;background:#1c1a16;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:20px;height:20px}
.logo-wordmark{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:#1c1a16;letter-spacing:-.2px}
.logo-pipe{width:1px;height:18px;background:var(--border);margin:0 6px}
.logo-tag{font-size:11px;color:var(--t3);font-weight:500}
.tb-nav{display:flex;align-items:center;height:100%;padding:0 6px}
.tbn{padding:0 13px;height:100%;display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;user-select:none;gap:5px}
.tbn:hover{color:var(--t2)}.tbn.act{color:var(--gold);border-bottom-color:var(--gold)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 16px}
.sync-btn{display:flex;align-items:center;gap:6px;background:var(--grbg);border:1px solid var(--grbr);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:600;color:var(--green);cursor:pointer;transition:all .15s}
.sync-btn:hover{box-shadow:var(--sh)}
.dot{width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.user-btn{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px 4px 5px;cursor:pointer;font-size:12px;font-weight:500;color:var(--t2)}
.uav{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),#8a5e20);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}

/* TOOLBAR */
.btb{height:44px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 16px;flex-shrink:0}
.bname{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--t1)}
.sep{width:1px;height:18px;background:var(--border);margin:0 2px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--gold);color:#fff}.btn-p:hover{background:var(--gold2);box-shadow:0 2px 8px rgba(184,137,42,.3)}
.btn-g{background:none;border:1.5px solid var(--brd2);color:var(--t2)}.btn-g:hover{border-color:var(--gold);color:var(--gold);background:var(--gdbg)}
.btn-q{background:none;border:none;color:var(--t3);padding:4px 8px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer}.btn-q:hover{background:var(--bg3);color:var(--t1)}
.chip{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1.5px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:var(--brd2)}
.chip.on{background:var(--gdbg);border-color:var(--gdbr);color:var(--gold)}
.chip.on-b{background:var(--bluebg);border-color:var(--bluebr);color:var(--blue)}
.chip.on-p{background:var(--purbg);border-color:var(--purbr);color:var(--pur)}
.av-xs{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0}

/* BOARD */
.bwrap{flex:1;overflow-x:auto;overflow-y:hidden;padding:14px 18px;display:flex}
.blayout{display:flex;gap:11px;align-items:flex-start;height:100%}

/* COL */
.col{width:var(--cw);min-width:var(--cw);background:var(--bg3);border:1px solid var(--border);border-radius:11px;display:flex;flex-direction:column;max-height:calc(100vh - 116px);flex-shrink:0;transition:border-color .15s,box-shadow .15s}
.col.over{border-color:var(--gold);box-shadow:0 0 0 3px var(--gdbg)}
.ch{padding:11px 13px 9px;display:flex;align-items:center;gap:7px;flex-shrink:0}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ctitle{font-size:12px;font-weight:700;color:var(--t1);flex:1}
.ccnt{background:var(--bg4);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600;color:var(--t3)}
.cmenu{background:none;border:none;color:var(--t3);cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px;line-height:1}.cmenu:hover{background:var(--bg4);color:var(--t1)}
.csep{height:1px;background:var(--border);margin:0 11px}
.cbody{overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:6px;flex:1}
.cadd{padding:7px 9px;flex-shrink:0}
.cadd-btn{width:100%;background:none;border:1.5px dashed var(--brd2);border-radius:8px;padding:7px;font-size:12px;font-weight:500;color:var(--t3);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.cadd-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gdbg)}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 11px;cursor:grab;user-select:none;position:relative;box-shadow:var(--sh);transition:box-shadow .15s,transform .15s,border-color .15s}
.card:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:var(--brd2)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.35;box-shadow:none}
.card.gcal{border-left:3px solid var(--blue)}
.card.todo{border-left:3px solid var(--pur)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.gcal-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--bluebg);color:var(--blue);border:1px solid var(--bluebr)}
.card-title{font-size:13px;font-weight:600;color:var(--t1);line-height:1.35;margin:5px 0 4px}
.card-addr{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:3px}
.card-foot{display:flex;align-items:center;gap:5px;margin-top:8px;padding-top:7px;border-top:1px solid var(--border)}
.card-date{font-size:10px;font-weight:500;color:var(--t3)}
.card-price{font-size:11px;font-weight:700;color:var(--gold)}
.avs{display:flex;margin-left:auto}
.av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;border:2px solid var(--bg2);flex-shrink:0}
.todo-row{display:flex;align-items:flex-start;gap:8px}
.chk{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;margin-top:1px;transition:all .15s}
.chk.done{background:var(--green);border-color:var(--green)}

/* ADD COL */
.add-col{width:220px;min-width:220px;border:2px dashed var(--brd2);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:70px;transition:all .15s;flex-shrink:0;background:transparent}
.add-col:hover{border-color:var(--gold);background:var(--gdbg)}
.add-col:hover span{color:var(--gold)}

/* DRAWER */
.drawer{position:fixed;top:0;right:-470px;width:450px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transition:right .25s ease;box-shadow:-4px 0 30px rgba(0,0,0,.08)}
.drawer.open{right:0}
.dr-top{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.dr-x{background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px;padding:3px 7px;border-radius:6px;line-height:1}.dr-x:hover{background:var(--bg3);color:var(--t1)}
.dr-body{flex:1;overflow-y:auto;padding:16px 18px}
.dlbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.dsec{margin-bottom:18px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.dfield{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.dfl{font-size:10px;color:var(--t3);font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.dfv{font-size:13px;color:var(--t1);font-weight:600}
.st-row{display:flex;gap:5px;flex-wrap:wrap}
.stb{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:none;color:var(--t3);font-family:inherit;transition:all .15s}
.stb:hover{border-color:var(--brd2);color:var(--t2)}
.stb.act{color:#fff}
.cli{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.cli:last-child{border-bottom:none}
.dr-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:7px;flex-shrink:0;background:var(--bg2)}
.inp{background:var(--bg3);border:1.5px solid var(--border);border-radius:7px;padding:7px 11px;font-size:13px;color:var(--t1);font-family:inherit;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--gold);background:var(--bg2)}

/* MODAL */
.mover{position:fixed;inset:0;background:rgba(28,26,22,.4);z-index:400;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.mover.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:24px;width:470px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.mtitle{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;margin-bottom:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:block}
.ov{position:fixed;inset:0;z-index:250;display:none}.ov.on{display:block}
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh">

<!-- TOPBAR -->
<div class="tb">
  <div class="tb-logo">
    <div class="logo-mark">
      <svg viewBox="0 0 20 20" fill="none">
        <path d="M3 17V8.5l7-4 7 4V17" stroke="#b8892a" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M7.5 17v-5h5v5" stroke="#b8892a" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="10" cy="6" r="1.4" fill="#b8892a"/>
      </svg>
    </div>
    <span class="logo-wordmark">ImmoPixels</span>
    <div class="logo-pipe"></div>
    <span class="logo-tag">Board</span>
  </div>
  <div class="tb-nav">
    <div class="tbn">Ügyfelek</div>
    <div class="tbn act">📋 Board</div>
    <div class="tbn">📅 Naptár</div>
    <div class="tbn">📊 Riportok</div>
  </div>
  <div class="tb-r">
    <div class="sync-btn" onclick="syncGcal()">
      <span class="dot" style="background:var(--green)"></span>
      <span id="sync-txt">GCal szinkron</span>
    </div>
    <div class="user-btn">
      <div class="uav">CD</div>
      <span>Cristian</span>
    </div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="btb">
  <span class="bname">ImmoPixels Board</span>
  <div class="sep"></div>
  <button class="btn btn-p" onclick="openM('new-card')">+ Új kártya</button>
  <button class="btn btn-g" onclick="openM('new-col')">+ Oszlop</button>
  <div class="sep"></div>
  <div class="chip on-b" onclick="this.classList.toggle('on-b')"><span class="dot" style="background:var(--blue)"></span>GCal job-ok</div>
  <div class="chip on-p" onclick="this.classList.toggle('on-p')"><span class="dot" style="background:var(--pur)"></span>Saját todo</div>
  <div class="chip" onclick="this.classList.toggle('on')">📷 Fotó</div>
  <div class="chip" onclick="this.classList.toggle('on')">🎞️ Reel</div>
  <div class="chip" onclick="this.classList.toggle('on')">🚁 Drón</div>
  <div class="sep"></div>
  <div class="chip" onclick="this.classList.toggle('on')"><div class="av-xs" style="background:var(--gdbg);color:var(--gold)">CD</div>Cristian</div>
  <div class="chip" onclick="this.classList.toggle('on')"><div class="av-xs" style="background:var(--bluebg);color:var(--blue)">DB</div>Daniel</div>
  <div class="chip" onclick="this.classList.toggle('on')"><div class="av-xs" style="background:var(--grbg);color:var(--green)">EL</div>Elias</div>
  <div style="margin-left:auto;display:flex;gap:3px">
    <button class="btn-q btn" id="vb-b" style="color:var(--gold);background:var(--gdbg)" onclick="setView('board')">⊞ Board</button>
    <button class="btn-q btn" id="vb-l" onclick="setView('list')">☰ Lista</button>
  </div>
</div>

<!-- BOARD -->
<div class="bwrap" id="bwrap"><div class="blayout" id="board"></div></div>

<!-- OVERLAY + DRAWER -->
<div class="ov" id="ov" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dr-top">
    <div style="flex:1;min-width:0">
      <div id="dr-badge" style="margin-bottom:7px"></div>
      <div id="dr-title" style="font-family:'Syne',sans-serif;font-weight:700;font-size:17px;line-height:1.3"></div>
    </div>
    <button class="dr-x" onclick="closeDrawer()">✕</button>
  </div>
  <div class="dr-body">
    <div class="dsec"><div class="dlbl">Státusz</div><div class="st-row" id="dr-statuses"></div></div>
    <div class="dgrid" id="dr-fields"></div>
    <div class="dsec">
      <div class="dlbl">Checklist</div>
      <div id="dr-cl"></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <input class="inp" id="cl-inp" placeholder="+ Elem hozzáadása..." onkeydown="if(event.key==='Enter')addCI()">
        <button class="btn btn-g" style="flex-shrink:0;padding:5px 11px" onclick="addCI()">+</button>
      </div>
    </div>
    <div class="dsec"><div class="dlbl">Megjegyzés</div><textarea class="inp" id="dr-note" rows="3" style="resize:none" placeholder="Ide jöhetnek a megjegyzések..."></textarea></div>
  </div>
  <div class="dr-foot">
    <button class="btn btn-p" style="flex:1;justify-content:center" onclick="save()">✓ Mentés</button>
    <button class="btn btn-g" onclick="nextStatus()">→ Következő</button>
    <button class="btn btn-g" style="color:var(--red);border-color:var(--rdbr)" onclick="delCard()">🗑</button>
  </div>
</div>

<!-- MODAL: ÚJ KÁRTYA -->
<div class="mover" id="modal-new-card">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
      <div class="mtitle" style="margin:0">+ Új kártya</div>
      <button style="background:none;border:none;cursor:pointer;color:var(--t3);font-size:18px;padding:3px 7px;border-radius:6px" onclick="closeM('new-card')">✕</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:13px">
      <button class="btn" id="nt-gcal" onclick="setT('gcal')" style="background:var(--bluebg);color:var(--blue);border:1.5px solid var(--bluebr)">📅 GCal job</button>
      <button class="btn btn-g" id="nt-todo" onclick="setT('todo')">✓ Todo</button>
      <button class="btn btn-g" id="nt-man" onclick="setT('man')">📷 Manuális</button>
    </div>
    <div style="margin-bottom:9px"><label class="lbl">Cím / Helyszín</label><input class="inp" id="nc-t" placeholder="pl. Heidelberger Str. 12"></div>
    <div class="fg">
      <div><label class="lbl">Dátum</label><input class="inp" type="date" id="nc-d" value="2026-05-20"></div>
      <div><label class="lbl">Időpont</label><input class="inp" type="time" id="nc-ti" value="10:00"></div>
    </div>
    <div class="fg">
      <div><label class="lbl">Típus</label>
        <select class="inp" id="nc-s">
          <option value="foto">📷 Fotó alap</option><option value="video">🎬 Videó</option>
          <option value="dron">🚁 Drón</option><option value="reel">🎞️ ImmoReels</option>
          <option value="foto-dron">📷🚁 Fotó + Drón</option>
        </select>
      </div>
      <div><label class="lbl">Ár (€)</label><input class="inp" type="number" id="nc-p" placeholder="280"></div>
    </div>
    <div style="margin-bottom:9px"><label class="lbl">Ügyfél</label>
      <select class="inp" id="nc-cl">
        <option>RE/MAX Mannheim</option><option>Engel & Völkers</option>
        <option>Müller Immobilien</option><option>Volksbank Immobilien</option>
        <option>Sparkasse Immo</option><option>+ Új ügyfél</option>
      </select>
    </div>
    <div style="margin-bottom:9px"><label class="lbl">Csapat</label>
      <div style="display:flex;gap:5px" id="nc-team">
        <div class="chip on" data-p="CD" onclick="this.classList.toggle('on')"><div class="av-xs" style="background:var(--gdbg);color:var(--gold)">CD</div>Cristian</div>
        <div class="chip" data-p="DB" onclick="this.classList.toggle('on')"><div class="av-xs" style="background:var(--bluebg);color:var(--blue)">DB</div>Daniel</div>
        <div class="chip" data-p="EL" onclick="this.classList.toggle('on')"><div class="av-xs" style="background:var(--grbg);color:var(--green)">EL</div>Elias</div>
      </div>
    </div>
    <div style="margin-bottom:15px"><label class="lbl">Oszlop</label>
      <select class="inp" id="nc-col">
        <option value="0">📥 Beérkező</option><option value="1">✓ Visszaigazolt</option>
        <option value="2">📷 Elvégzés alatt</option><option value="3">📦 Leadás</option>
        <option value="4">💶 Számlázás</option><option value="5">✅ Kész</option>
      </select>
    </div>
    <div style="display:flex;gap:7px;justify-content:flex-end">
      <button class="btn btn-g" onclick="closeM('new-card')">Mégsem</button>
      <button class="btn btn-p" onclick="createCard()">+ Létrehozás</button>
    </div>
  </div>
</div>

<!-- MODAL: ÚJ OSZLOP -->
<div class="mover" id="modal-new-col">
  <div class="modal" style="width:320px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
      <div class="mtitle" style="margin:0">+ Új oszlop</div>
      <button style="background:none;border:none;cursor:pointer;color:var(--t3);font-size:18px" onclick="closeM('new-col')">✕</button>
    </div>
    <div style="margin-bottom:11px"><label class="lbl">Neve</label><input class="inp" id="ncol-n" placeholder="pl. Minőségellenőrzés"></div>
    <div style="margin-bottom:16px"><label class="lbl">Szín</label>
      <div style="display:flex;gap:7px;margin-top:5px" id="colpicks">
        <div style="width:24px;height:24px;border-radius:50%;background:#1d5ec7;cursor:pointer;transition:.15s" onclick="pickC(this,'#1d5ec7')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#b8892a;cursor:pointer;transition:.15s" onclick="pickC(this,'#b8892a')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#15803d;cursor:pointer;transition:.15s" onclick="pickC(this,'#15803d')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#6d28d9;cursor:pointer;transition:.15s" onclick="pickC(this,'#6d28d9')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#b91c1c;cursor:pointer;transition:.15s" onclick="pickC(this,'#b91c1c')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#a16207;cursor:pointer;transition:.15s" onclick="pickC(this,'#a16207')"></div>
      </div>
    </div>
    <div style="display:flex;gap:7px;justify-content:flex-end">
      <button class="btn btn-g" onclick="closeM('new-col')">Mégsem</button>
      <button class="btn btn-p" onclick="addCol()">Létrehozás</button>
    </div>
  </div>
</div>

<script>
const TC={CD:'#b8892a18',DB:'#1d5ec712',EL:'#15803d12'};
const TT={CD:'var(--gold)',DB:'var(--blue)',EL:'var(--green)'};
const T={
  foto:{i:'📷',l:'Fotó',c:'#b8892a',bg:'#b8892a14',br:'#b8892a30'},
  video:{i:'🎬',l:'Videó',c:'#1d5ec7',bg:'#1d5ec712',br:'#1d5ec730'},
  dron:{i:'🚁',l:'Drón',c:'#15803d',bg:'#15803d12',br:'#15803d30'},
  reel:{i:'🎞️',l:'Reel',c:'#6d28d9',bg:'#6d28d912',br:'#6d28d930'},
  'foto-dron':{i:'📷🚁',l:'F+D',c:'#a16207',bg:'#a1620712',br:'#a1620730'},
};

let ncColor='#1d5ec7', selT='gcal', active=null, dci=null, dki=null;

const cols=[
  {id:'c0',title:'📥 Beérkező',dot:'#9c9589',cards:[
    {id:'k1',gcal:1,type:'foto',title:'Heidelberger Str. 12',addr:'Mannheim',client:'RE/MAX',date:'05-13',time:'09:30',price:280,team:['CD'],note:'',cl:[{t:'Kamera csekk',d:0},{t:'Parkolás nézni',d:0}]},
    {id:'k2',gcal:1,type:'reel',title:'Parkring 5',addr:'Ludwigshafen',client:'Engel & Völkers',date:'05-13',time:'11:00',price:520,team:['DB','CD'],note:'',cl:[]},
  ]},
  {id:'c1',title:'✓ Visszaigazolt',dot:'#1d5ec7',cards:[
    {id:'k3',gcal:1,type:'foto',title:'Seckenheimer Landstr. 55',addr:'Mannheim',client:'Volksbank',date:'05-13',time:'16:30',price:260,team:['CD'],note:'',cl:[]},
    {id:'k4',gcal:1,type:'dron',title:'Winzerstr. 8 — Neustadt',addr:'Neustadt a.d.W.',client:'Müller Immo',date:'05-14',time:'14:00',price:480,team:['CD','EL'],note:'Drón üzemanyag!',cl:[{t:'Repülési engedély',d:1},{t:'Időjárás check',d:0}]},
    {id:'k5',todo:1,title:'Sandra Kleinnek ImmoReels ajánlatot küldeni',client:'RE/MAX',date:'05-14',time:'',price:0,team:['CD'],note:'',cl:[]},
  ]},
  {id:'c2',title:'📷 Elvégzés alatt',dot:'#a16207',cards:[
    {id:'k6',gcal:1,type:'foto',title:'Käfertaler Str. 190',addr:'Mannheim',client:'Schmidt (privát)',date:'05-09',time:'15:00',price:220,team:['CD'],note:'Parkolás az udvarban',cl:[{t:'RAW mentés',d:1},{t:'Lightroom szerkesztés',d:0}]},
  ]},
  {id:'c3',title:'📦 Leadás',dot:'#6d28d9',cards:[
    {id:'k7',gcal:1,type:'reel',title:'Friedrichsplatz 8',addr:'Mannheim',client:'Volksbank',date:'05-10',time:'11:00',price:350,team:['DB'],note:'',cl:[{t:'Drive link',d:1},{t:'Email küldés',d:0}]},
    {id:'k8',todo:1,title:'Müller #039 késedelmes számla',client:'Müller Immo',date:'05-12',price:0,team:['CD'],note:'',cl:[]},
  ]},
  {id:'c4',title:'💶 Számlázás',dot:'#b91c1c',cards:[
    {id:'k9',gcal:1,type:'foto',title:'Schillerstr. 18',addr:'Heidelberg',client:'Engel & Völkers',date:'05-07',time:'10:00',price:280,team:['CD'],note:'',cl:[]},
  ]},
  {id:'c5',title:'✅ Kész',dot:'#15803d',cards:[
    {id:'k10',gcal:1,type:'foto',title:'Rheinuferstr. 22',addr:'Mannheim',client:'RE/MAX',date:'05-06',time:'09:00',price:280,team:['CD'],note:'',cl:[{t:'Képek kész',d:1},{t:'Email elküldve',d:1},{t:'Kiszámlázva',d:1}]},
    {id:'k11',gcal:1,type:'video',title:'Tattersallstr. 1',addr:'Mannheim',client:'Sparkasse',date:'05-04',time:'13:00',price:350,team:['DB'],note:'',cl:[{t:'Vágás',d:1},{t:'Elküldve',d:1}]},
  ]},
];

function render(){
  const b=document.getElementById('board');b.innerHTML='';
  cols.forEach((col,ci)=>{
    const el=document.createElement('div');el.className='col';
    el.innerHTML=`<div class="ch"><div class="cdot" style="background:${col.dot}"></div><div class="ctitle">${col.title}</div><div class="ccnt">${col.cards.length}</div><button class="cmenu" onclick="renameCol(${ci})">⋯</button></div><div class="csep"></div><div class="cbody" id="cb${ci}"></div><div class="cadd"><button class="cadd-btn" onclick="quickAdd(${ci})">+ Kártya hozzáadás</button></div>`;
    b.appendChild(el);
    const body=document.getElementById('cb'+ci);
    col.cards.forEach((card,ki)=>body.appendChild(mkCard(card,ci,ki)));
    body.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});
    body.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over')});
    body.addEventListener('drop',e=>{
      e.preventDefault();el.classList.remove('over');
      if(dci===null||dci===ci)return;
      const c=cols[dci].cards.splice(dki,1)[0];cols[ci].cards.push(c);render();
    });
  });
  const ac=document.createElement('div');ac.className='add-col';ac.onclick=()=>openM('new-col');
  ac.innerHTML='<div style="display:flex;align-items:center;gap:6px"><span style="font-size:20px;color:var(--t3)">+</span><span style="font-size:13px;font-weight:500;color:var(--t3)">Oszlop hozzáadása</span></div>';
  b.appendChild(ac);
}

function mkCard(card,ci,ki){
  const el=document.createElement('div');
  el.className='card'+(card.gcal?' gcal':'')+(card.todo?' todo':'');
  el.draggable=true;
  const t=T[card.type]||T.foto;
  const done=(card.cl||[]).filter(x=>x.d).length, tot=(card.cl||[]).length;
  if(card.todo){
    const all=tot>0&&done===tot;
    el.innerHTML=`<div class="todo-row"><div class="chk${all?' done':''}" onclick="event.stopPropagation();">${all?'<svg width="9" height="9" viewBox="0 0 9 9"><path d="M1.5 4.5l2 2 4-4" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>':''}</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:${all?'var(--t3)':'var(--t1)'};text-decoration:${all?'line-through':'none'};line-height:1.35">${card.title}</div><div class="card-foot" style="margin-top:6px;padding-top:6px"><span class="card-date">${card.date?'📅 '+card.date:''}</span><div class="avs">${(card.team||[]).map(p=>`<div class="av" style="background:${TC[p]};color:${TT[p]}">${p}</div>`).join('')}</div></div></div></div><span style="position:absolute;top:8px;right:8px;background:var(--purbg);color:var(--pur);border:1px solid var(--purbr);border-radius:3px;font-size:9px;font-weight:700;padding:1px 5px">TODO</span>`;
  } else {
    el.innerHTML=`<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px"><span class="badge" style="background:${t.bg};color:${t.c};border:1px solid ${t.br}">${t.i} ${t.l}</span>${card.gcal?'<span class="gcal-tag">● GCal</span>':''}${tot?`<span style="margin-left:auto;font-size:10px;font-weight:600;color:${done===tot?'var(--green)':'var(--t3)'}">${done===tot?'✓ ':''  }${done}/${tot}</span>`:''}</div><div class="card-title">${card.title}</div>${card.addr?`<div class="card-addr">📍 <span>${card.addr}</span> · <span style="color:var(--t2)">${card.client}</span></div>`:''}<div class="card-foot"><span class="card-date">${card.date?'📅 '+card.date+(card.time?' · '+card.time:''):''}</span>${card.price?`<span class="card-price">€${card.price}</span>`:''}<div class="avs">${(card.team||[]).map((p,i)=>`<div class="av" style="background:${TC[p]};color:${TT[p]};margin-left:${i?'-5px':'0'}">${p}</div>`).join('')}</div></div>`;
  }
  el.addEventListener('click',()=>openDrawer(card,ci,ki));
  el.addEventListener('dragstart',()=>{dci=ci;dki=ki;setTimeout(()=>el.classList.add('dragging'),0)});
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');dci=dki=null;document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'))});
  return el;
}

function openDrawer(card,ci,ki){
  active={card,ci,ki};
  const t=T[card.type]||T.foto;
  document.getElementById('dr-badge').innerHTML=card.todo?'<span class="badge" style="background:var(--purbg);color:var(--pur);border:1px solid var(--purbr)">✓ TODO</span>':`<span class="badge" style="background:${t.bg};color:${t.c};border:1px solid ${t.br}">${t.i} ${t.l}</span>${card.gcal?'<span class="gcal-tag" style="margin-left:6px">● GCal</span>':''}`;
  document.getElementById('dr-title').textContent=card.title;
  document.getElementById('dr-statuses').innerHTML=cols.map((c,i)=>`<button class="stb${i===ci?' act':''}" style="${i===ci?`background:${c.dot};border-color:${c.dot}`:''}" onclick="moveTo(${i})">${c.title}</button>`).join('');
  const flds=[];
  if(!card.todo){
    if(card.client)flds.push({l:'Ügyfél',v:card.client});
    if(card.date)flds.push({l:'Dátum',v:card.date+(card.time?' · '+card.time:'')});
    if(card.addr)flds.push({l:'Helyszín',v:card.addr});
    if(card.price)flds.push({l:'Ár',v:`<span style="color:var(--gold);font-weight:700;font-size:15px">€${card.price}</span>`});
    flds.push({l:'Csapat',v:(card.team||[]).map(p=>`<div class="av" style="background:${TC[p]};color:${TT[p]};display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-right:3px">${p}</div>`).join('')});
  } else {
    if(card.date)flds.push({l:'Határidő',v:card.date});
    if(card.client)flds.push({l:'Kapcsolódó',v:card.client});
  }
  document.getElementById('dr-fields').innerHTML=flds.map(f=>`<div class="dfield"><div class="dfl">${f.l}</div><div class="dfv">${f.v}</div></div>`).join('');
  renderCL(card);
  document.getElementById('dr-note').value=card.note||'';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('ov').classList.add('on');
}
function renderCL(card){
  document.getElementById('dr-cl').innerHTML=(card.cl||[]).length
    ?(card.cl||[]).map((item,i)=>`<div class="cli"><div class="chk${item.d?' done':''}" onclick="togCL(${i})">${item.d?'<svg width="9" height="9" viewBox="0 0 9 9"><path d="M1.5 4.5l2 2 4-4" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>':''}</div><span style="flex:1;font-size:13px;color:${item.d?'var(--t3)':'var(--t1)'};text-decoration:${item.d?'line-through':'none'}">${item.t}</span><button onclick="remCL(${i})" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;padding:0 4px;border-radius:4px" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--t3)'">×</button></div>`).join('')
    :'<div style="font-size:12px;color:var(--t3);padding:5px 0">Még nincs elem</div>';
}
function togCL(i){if(!active)return;active.card.cl[i].d=!active.card.cl[i].d;renderCL(active.card);render()}
function remCL(i){if(!active)return;active.card.cl.splice(i,1);renderCL(active.card)}
function addCI(){if(!active)return;const inp=document.getElementById('cl-inp');if(!inp.value.trim())return;active.card.cl.push({t:inp.value.trim(),d:0});inp.value='';renderCL(active.card)}
function moveTo(tc){if(!active)return;const{card,ci,ki}=active;cols[ci].cards.splice(ki,1);cols[tc].cards.push(card);closeDrawer();render()}
function nextStatus(){if(!active)return;moveTo(Math.min(active.ci+1,cols.length-1))}
function save(){if(active)active.card.note=document.getElementById('dr-note').value;closeDrawer();render()}
function delCard(){if(!active)return;cols[active.ci].cards.splice(active.ki,1);closeDrawer();render()}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('ov').classList.remove('on');active=null}
function openM(id){document.getElementById('modal-'+id).classList.add('open')}
function closeM(id){document.getElementById('modal-'+id).classList.remove('open')}
function setT(t){
  selT=t;
  document.getElementById('nt-gcal').style.cssText=t==='gcal'?'background:var(--bluebg);color:var(--blue);border:1.5px solid var(--bluebr)':'';
  document.getElementById('nt-gcal').className=t==='gcal'?'btn':'btn btn-g';
  document.getElementById('nt-todo').className=t==='todo'?'btn btn-p':'btn btn-g';
  document.getElementById('nt-man').className=t==='man'?'btn btn-p':'btn btn-g';
}
function createCard(){
  const title=document.getElementById('nc-t').value.trim();if(!title){alert('Adj meg egy nevet!');return}
  const ci=parseInt(document.getElementById('nc-col').value);
  const team=[...document.querySelectorAll('#nc-team .chip.on')].map(x=>x.dataset.p);
  cols[ci].cards.push({id:'k'+Date.now(),gcal:selT==='gcal'?1:0,todo:selT==='todo'?1:0,type:document.getElementById('nc-s').value,title,addr:'',client:document.getElementById('nc-cl').value,date:document.getElementById('nc-d').value.slice(5),time:document.getElementById('nc-ti').value,price:parseInt(document.getElementById('nc-p').value)||0,team:team.length?team:['CD'],note:'',cl:[]});
  document.getElementById('nc-t').value='';closeM('new-card');render();
}
function addCol(){const n=document.getElementById('ncol-n').value.trim();if(!n)return;cols.push({id:'col'+Date.now(),title:n,dot:ncColor,cards:[]});document.getElementById('ncol-n').value='';closeM('new-col');render()}
function pickC(el,c){ncColor=c;document.querySelectorAll('#colpicks div').forEach(x=>x.style.outline='none');el.style.outline='3px solid var(--t1)'}
function quickAdd(ci){document.getElementById('nc-col').value=ci;openM('new-card')}
function renameCol(ci){const n=prompt('Oszlop neve:',cols[ci].title);if(n){cols[ci].title=n;render()}}
function syncGcal(){
  const el=document.getElementById('sync-txt');el.textContent='Szinkronizálás...';
  setTimeout(()=>{
    if(!cols[0].cards.find(c=>c.id==='knew'))cols[0].cards.unshift({id:'knew',gcal:1,type:'foto',title:'Neumannstr. 42 — új GCal import',addr:'Mannheim',client:'RE/MAX',date:'05-20',time:'10:00',price:280,team:['CD'],note:'',cl:[]});
    render();el.textContent='Szinkronizált ✓';setTimeout(()=>el.textContent='GCal szinkron',2500);
  },900);
}
function setView(v){
  document.getElementById('vb-b').style.cssText=v==='board'?'color:var(--gold);background:var(--gdbg)':'color:var(--t3);background:none';
  document.getElementById('vb-l').style.cssText=v==='list'?'color:var(--gold);background:var(--gdbg)':'color:var(--t3);background:none';
  const bw=document.getElementById('bwrap');
  if(v==='list'){
    bw.innerHTML=`<div style="max-width:740px;width:100%;padding:4px 0">${cols.map(col=>`<div style="margin-bottom:20px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:2px solid var(--border)"><div style="width:9px;height:9px;border-radius:50%;background:${col.dot}"></div><span style="font-weight:700;font-size:13px">${col.title}</span><span style="font-size:11px;font-weight:600;color:var(--t3);background:var(--bg3);padding:1px 6px;border-radius:4px">${col.cards.length}</span></div>${col.cards.map(c=>`<div style="display:flex;align-items:center;gap:11px;padding:9px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;box-shadow:var(--sh)"><span style="font-size:15px">${c.todo?'✓':(T[c.type]||T.foto).i}</span><div style="flex:1"><div style="font-size:13px;font-weight:600">${c.title}</div><div style="font-size:11px;color:var(--t3);margin-top:1px">${c.client||''}${c.date?' · '+c.date:''}</div></div>${c.price?`<span style="font-size:12px;font-weight:700;color:var(--gold)">€${c.price}</span>`:''}</div>`).join('')||'<div style="font-size:12px;color:var(--t3);padding:5px 0">Nincs kártya</div>'}</div>`).join('')}</div>`;
  } else {bw.innerHTML='<div class="blayout" id="board"></div>';render()}
}
document.querySelectorAll('.mover').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
render();
</script>
</body>
</html>
