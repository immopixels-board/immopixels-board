<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImmoPixels CRM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Arial&display=swap');
:root {
  --bg:#f4f2ef;--bg2:#ffffff;--bg3:#eeebe6;--bg4:#e4e0d9;
  --border:#ddd9d2;--brd2:#c8c3ba;
  --gold:#b8892a;--gold2:#d4a845;--gdbg:#b8892a14;--gdbr:#b8892a35;
  --blue:#1d5ec7;--bluebg:#1d5ec712;--bluebr:#1d5ec730;
  --green:#15803d;--grbg:#15803d12;--grbr:#15803d30;
  --red:#b91c1c;--rdbg:#b91c1c12;--rdbr:#b91c1c30;
  --yel:#a16207;--yelbg:#a1620712;--yelbr:#a1620730;
  --pur:#6d28d9;--purbg:#6d28d912;--purbr:#6d28d930;
  --t1:#1c1a16;--t2:#4a4640;--t3:#8a8278;
  --cw:272px;--sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);--sh2:0 4px 20px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:Arial,sans-serif;color:var(--t1);overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}

/* TOPBAR */
.tb{height:54px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;flex-shrink:0;box-shadow:var(--sh);z-index:100}
.tb-logo{display:flex;align-items:center;gap:10px;padding:0 18px;border-right:1px solid var(--border);height:100%;text-decoration:none}
.tb-nav{display:flex;align-items:center;height:100%;padding:0 4px}
.tbn{padding:0 14px;height:100%;display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;user-select:none;gap:5px}
.tbn:hover{color:var(--t2)}.tbn.act{color:var(--gold);border-bottom-color:var(--gold)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 16px}
.sync-btn{display:flex;align-items:center;gap:6px;background:var(--grbg);border:1px solid var(--grbr);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:700;color:var(--green);cursor:pointer}
.dot{width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.user-btn{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px 4px 5px;cursor:pointer;font-size:12px;font-weight:600;color:var(--t2)}
.uav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d4a845,#8a5e20);overflow:hidden;flex-shrink:0}
.uav img{width:100%;height:100%;object-fit:cover}

/* PAGES */
.page{display:none;flex:1;overflow:hidden;flex-direction:column}.page.act{display:flex}

/* BOARD TOOLBAR */
.btb{height:44px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 16px;flex-shrink:0}
.bname{font-size:15px;font-weight:700;color:var(--t1)}
.sep{width:1px;height:18px;background:var(--border);margin:0 2px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:Arial,sans-serif;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--gold);color:#fff}.btn-p:hover{background:var(--gold2)}
.btn-g{background:none;border:1.5px solid var(--brd2);color:var(--t2)}.btn-g:hover{border-color:var(--gold);color:var(--gold);background:var(--gdbg)}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{opacity:.9}
.btn-q{background:none;border:none;color:var(--t3);padding:4px 8px;border-radius:6px;font-size:12px;font-family:Arial,sans-serif;cursor:pointer}.btn-q:hover{background:var(--bg3);color:var(--t1)}
.chip{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1.5px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:700;color:var(--t3);cursor:pointer;transition:all .15s;user-select:none}
.chip.on{background:var(--gdbg);border-color:var(--gdbr);color:var(--gold)}
.chip.on-b{background:var(--bluebg);border-color:var(--bluebr);color:var(--blue)}
.chip.on-p{background:var(--purbg);border-color:var(--purbr);color:var(--pur)}
.av-xs{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;overflow:hidden}
.av-xs img{width:100%;height:100%;object-fit:cover}

/* BOARD */
.bwrap{flex:1;overflow-x:auto;overflow-y:hidden;padding:14px 18px;display:flex}
.blayout{display:flex;gap:11px;align-items:flex-start;height:100%}
.col{width:var(--cw);min-width:var(--cw);background:var(--bg3);border:1px solid var(--border);border-radius:11px;display:flex;flex-direction:column;max-height:calc(100vh - 116px);flex-shrink:0;transition:border-color .15s,box-shadow .15s}
.col.over{border-color:var(--gold);box-shadow:0 0 0 3px var(--gdbg)}
.ch{padding:11px 13px 9px;display:flex;align-items:center;gap:7px;flex-shrink:0}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ctitle{font-size:12px;font-weight:700;color:var(--t1);flex:1}
.ccnt{background:var(--bg4);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;color:var(--t3)}
.cmenu{background:none;border:none;color:var(--t3);cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px;line-height:1}.cmenu:hover{background:var(--bg4);color:var(--t1)}
.csep{height:1px;background:var(--border);margin:0 11px}
.cbody{overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:6px;flex:1}
.cadd{padding:7px 9px;flex-shrink:0}
.cadd-btn{width:100%;background:none;border:1.5px dashed var(--brd2);border-radius:8px;padding:7px;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.cadd-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gdbg)}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 11px;cursor:grab;user-select:none;position:relative;box-shadow:var(--sh);transition:box-shadow .15s,transform .15s,border-color .15s}
.card:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:var(--brd2)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.35;box-shadow:none;transform:none}
.card.gcal{border-left:3px solid var(--blue)}
.card.todo{border-left:3px solid var(--pur)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.gcal-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--bluebg);color:var(--blue);border:1px solid var(--bluebr)}
.card-title{font-size:13px;font-weight:700;color:var(--t1);line-height:1.35;margin:5px 0 3px}
.card-addr{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:3px;margin-bottom:2px}
.card-desc{font-size:11px;color:var(--t2);margin-bottom:3px;line-height:1.4}
.card-note-inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:4px 7px;font-size:11px;color:var(--t2);font-family:Arial,sans-serif;resize:none;outline:none;margin-top:5px;transition:border-color .15s}
.card-note-inp:focus{border-color:var(--gold);background:var(--bg2)}
.card-foot{display:flex;align-items:center;gap:5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.card-date{font-size:10px;font-weight:600;color:var(--t3)}
.avs{display:flex;margin-left:auto}
.av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;border:2px solid var(--bg2);flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.chk{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;margin-top:1px;transition:all .15s}
.chk.done{background:var(--green);border-color:var(--green)}
.add-col{width:210px;min-width:210px;border:2px dashed var(--brd2);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:70px;transition:all .15s;flex-shrink:0;background:transparent}
.add-col:hover{border-color:var(--gold);background:var(--gdbg)}

/* DRAWER */
.drawer{position:fixed;top:0;right:-470px;width:450px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transition:right .25s ease;box-shadow:-4px 0 30px rgba(0,0,0,.08)}
.drawer.open{right:0}
.dr-top{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.dr-x{background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px;padding:3px 7px;border-radius:6px;line-height:1}.dr-x:hover{background:var(--bg3);color:var(--t1)}
.dr-body{flex:1;overflow-y:auto;padding:16px 18px}
.dlbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.dsec{margin-bottom:18px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.dfield{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.dfl{font-size:10px;color:var(--t3);font-weight:700;margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.dfv{font-size:13px;color:var(--t1);font-weight:700}
.st-row{display:flex;gap:5px;flex-wrap:wrap}
.stb{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:none;color:var(--t3);font-family:Arial,sans-serif;transition:all .15s}
.stb:hover{border-color:var(--brd2);color:var(--t2)}.stb.act{color:#fff}
.cli{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}.cli:last-child{border-bottom:none}
.dr-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:7px;flex-shrink:0;background:var(--bg2)}
.inp{background:var(--bg3);border:1.5px solid var(--border);border-radius:7px;padding:7px 11px;font-size:13px;color:var(--t1);font-family:Arial,sans-serif;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--gold);background:var(--bg2)}
select.inp{cursor:pointer}

/* MODAL */
.mover{position:fixed;inset:0;background:rgba(28,26,22,.4);z-index:400;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.mover.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:24px;width:500px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.12);max-height:90vh;overflow-y:auto}
.mtitle{font-size:16px;font-weight:700;margin-bottom:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:block}
.ov{position:fixed;inset:0;z-index:250;display:none}.ov.on{display:block}

/* CALENDAR PAGE */
.cal-frame{flex:1;border:none;width:100%;display:block}

/* CLIENTS PAGE */
.page-inner{flex:1;overflow-y:auto;padding:24px}
.card-list{background:var(--bg2);border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:var(--sh)}
.list-row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:var(--bg3)}
.list-head{display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--bg3);border-bottom:1px solid var(--border)}
.list-hd{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:700;color:var(--t1)}
.tag{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}

/* MITARBEITER */
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.staff-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:var(--sh)}
.staff-card:hover{border-color:var(--brd2);box-shadow:var(--sh2);transform:translateY(-2px)}
.staff-avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:linear-gradient(135deg,#d4a845,#8a5e20);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;position:relative;cursor:pointer}
.staff-avatar img{width:100%;height:100%;object-fit:cover}
.staff-avatar-edit{position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;font-size:18px}
.staff-card:hover .staff-avatar-edit{display:flex}
.staff-name{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:3px}
.staff-role{font-size:12px;color:var(--t3);margin-bottom:10px}
.staff-info{font-size:11px;color:var(--t2);margin-bottom:3px;display:flex;align-items:center;justify-content:center;gap:5px}

/* FORM */
.form-section{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:18px;margin-bottom:14px}
.form-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row-1{margin-bottom:10px}
</style>
</head>

function fmtDate(d){
  if(!d)return'';

}

function render(){

    const body=document.getElementById('cb'+ci);
    col.cards.forEach((card,ki)=>body.appendChild(mkCard(card,ci,ki)));
    body.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});
    body.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over')});

      e.preventDefault();el.classList.remove('over');
      if(dci===null||dci===ci)return;
      const c=cols[dci].cards.splice(dki,1)[0];cols[ci].cards.push(c);render();
    });
  });
  const ac=document.createElement('div');ac.className='add-col';ac.onclick=()=>openM('new-col');
  ac.innerHTML='<div style="display:flex;align-items:center;gap:6px"><span style="font-size:20px;color:var(--t3)">+</span><span style="font-size:13px;font-weight:600;color:var(--t3)">Oszlop</span></div>';
  b.appendChild(ac);
}

function mkCard(card,ci,ki){
  const el=document.createElement('div');
  el.className='card'+(card.gcal?' gcal':'')+(card.todo?' todo':'');
  el.draggable=true;
  const t=T[card.type]||T.foto;
  const done=(card.cl||[]).filter(x=>x.d).length,tot=(card.cl||[]).length;
  const dateLbl=card.date?`<span style="background:var(--bluebg);color:var(--blue);border:1px solid var(--bluebr);border-radius:3px;font-size:9px;font-weight:700;padding:1px 5px">${fmtDate(card.date)}${card.time?' '+card.time:''}</span>`:'';
  const avHtml=(card.team||[]).map((p,i)=>staffAvHtml(p,20)).join('');

  if(card.todo){
    const all=tot>0&&done===tot;
    el.innerHTML=`<div style="display:flex;align-items:flex-start;gap:8px"><div class="chk${all?' done':''}" onclick="event.stopPropagation();">${all?'<svg width="9" height="9" viewBox="0 0 9 9"><path d="M1.5 4.5l2 2 4-4" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>':''}</div><div style="flex:1"><div style="font-size:13px;font-weight:700;color:${all?'var(--t3)':'var(--t1)'};text-decoration:${all?'line-through':'none'};line-height:1.35">${card.title}</div><div class="card-foot" style="margin-top:6px;padding-top:6px">${dateLbl}<div class="avs">${avHtml}</div></div></div></div><span style="position:absolute;top:8px;right:8px;background:var(--purbg);color:var(--pur);border:1px solid var(--purbr);border-radius:3px;font-size:9px;font-weight:700;padding:1px 5px">TODO</span>`;
  } else {
    el.innerHTML=`
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">
        <span class="badge" style="background:${t.bg};color:${t.c};border:1px solid ${t.br}">${t.i} ${t.l}</span>
        ${card.gcal?'<span class="gcal-tag">● GCal</span>':''}
        ${tot?`<span style="margin-left:auto;font-size:10px;font-weight:700;color:${done===tot?'var(--green)':'var(--t3)'}">${done===tot?'✓ ':''  }${done}/${tot}</span>`:''}
      </div>
      <div class="card-title">${card.title}</div>
      ${card.addr?`<div class="card-addr">📍 <span style="color:var(--t2)">${card.addr}</span></div>`:''}
      ${card.desc?`<div class="card-desc">${card.desc}</div>`:''}
      <textarea class="card-note-inp" rows="1" placeholder="Gyors megjegyzés..." onclick="event.stopPropagation()" oninput="saveNote(${ci},${ki},this.value)">${card.note||''}</textarea>
      <div class="card-foot">
        ${dateLbl}
        <div class="avs" style="margin-left:auto">${avHtml}</div>
      </div>`;
  }
  el.addEventListener('click',()=>openDrawer(card,ci,ki));
  el.addEventListener('dragstart',()=>{dci=ci;dki=ki;setTimeout(()=>el.classList.add('dragging'),0)});
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');dci=dki=null;document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'))});
  return el;
}

function saveNote(ci,ki,val){cols[ci].cards[ki].note=val}

// ── DRAWER ─────────────────────────────────────────────────────
function openDrawer(card,ci,ki){
  active={card,ci,ki};
  const t=T[card.type]||T.foto;
  document.getElementById('dr-badge').innerHTML=card.todo
    ?'<span class="badge" style="background:var(--purbg);color:var(--pur);border:1px solid var(--purbr)">✓ TODO</span>'
    :`<span class="badge" style="background:${t.bg};color:${t.c};border:1px solid ${t.br}">${t.i} ${t.l}</span>${card.gcal?'<span class="gcal-tag" style="margin-left:6px">● GCal</span>':''}`;
  document.getElementById('dr-title').textContent=card.title;
  document.getElementById('dr-statuses').innerHTML=cols.map((c,i)=>
    `<button class="stb${i===ci?' act':''}" style="${i===ci?`background:${c.dot};border-color:${c.dot}`:''}" onclick="moveTo(${i})">${c.title}</button>`
  ).join('');
  const flds=[];
  if(!card.todo){
    if(card.client)flds.push({l:'Ügyfél',v:card.client});
    if(card.date)flds.push({l:'Dátum / Idő',v:fmtDate(card.date)+(card.time?' · '+card.time:'')});
    if(card.addr)flds.push({l:'Helyszín',v:card.addr});
    if(card.desc)flds.push({l:'Leírás',v:card.desc});
    if(card.price)flds.push({l:'Ár',v:`<span style="color:var(--gold);font-weight:700;font-size:15px">€${card.price}</span>`});
    // Client email
    const cl=clientList.find(c=>c.name.toLowerCase().includes((card.client||'').toLowerCase()));
    if(cl&&cl.cemail)flds.push({l:'Email',v:`<a href="mailto:${cl.cemail}" style="color:var(--blue)">${cl.cemail}</a>`});
    flds.push({l:'Csapat',v:(card.team||[]).map(p=>staffAvHtml(p,24)).join('')});
  } else {
    if(card.date)flds.push({l:'Határidő',v:fmtDate(card.date)});
  }
  document.getElementById('dr-fields').innerHTML=flds.map(f=>`<div class="dfield"><div class="dfl">${f.l}</div><div class="dfv">${f.v}</div></div>`).join('');
  renderCL(card);
  document.getElementById('dr-note').value=card.note||'';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('ov').classList.add('on');
}
function renderCL(card){
  document.getElementById('dr-cl').innerHTML=(card.cl||[]).length
    ?(card.cl||[]).map((item,i)=>`<div class="cli"><div class="chk${item.d?' done':''}" onclick="togCL(${i})">${item.d?'<svg width="9" height="9" viewBox="0 0 9 9"><path d="M1.5 4.5l2 2 4-4" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>':''}</div><span style="flex:1;font-size:13px;color:${item.d?'var(--t3)':'var(--t1)'};text-decoration:${item.d?'line-through':'none'}">${item.t}</span><button onclick="remCL(${i})" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;padding:0 4px">×</button></div>`).join('')
    :'<div style="font-size:12px;color:var(--t3);padding:5px 0">Még nincs elem</div>';
}
function togCL(i){if(!active)return;active.card.cl[i].d=!active.card.cl[i].d;renderCL(active.card);render()}
function remCL(i){if(!active)return;active.card.cl.splice(i,1);renderCL(active.card)}
function addCI(){if(!active)return;const inp=document.getElementById('cl-inp');if(!inp.value.trim())return;active.card.cl.push({t:inp.value.trim(),d:0});inp.value='';renderCL(active.card)}
function moveTo(tc){if(!active)return;const{card,ci,ki}=active;cols[ci].cards.splice(ki,1);cols[tc].cards.push(card);closeDrawer();render()}
function nextStatus(){if(!active)return;moveTo(Math.min(active.ci+1,cols.length-1))}
function save(){if(active)active.card.note=document.getElementById('dr-note').value;closeDrawer();render()}
function delCard(){if(!active)return;if(!confirm('Biztosan törlöd?'))return;cols[active.ci].cards.splice(active.ki,1);closeDrawer();render()}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('ov').classList.remove('on');active=null}

// ── MODALS ─────────────────────────────────────────────────────
function openM(id){document.getElementById('modal-'+id).classList.add('open')}
function closeM(id){document.getElementById('modal-'+id).classList.remove('open')}
function setT(t){
  selT=t;
  ['gcal','todo','man'].forEach(x=>{
    const b=document.getElementById('nt-'+x);if(!b)return;
    b.style.cssText=x===t&&t==='gcal'?'background:var(--bluebg);color:var(--blue);border:1.5px solid var(--bluebr)':'';
    b.className=x===t?'btn btn-p':'btn btn-g';
    if(x===t&&t==='gcal')b.style.cssText='background:var(--bluebg);color:var(--blue);border:1.5px solid var(--bluebr)';
  });
}

// ── CREATE CARD ────────────────────────────────────────────────
function createCard(){
  const title=document.getElementById('nc-t').value.trim();if(!title){alert('Adj meg egy nevet!');return}
  const ci=parseInt(document.getElementById('nc-col').value);
  const team=[...document.querySelectorAll('#nc-team-sel .chip.on')].map(x=>x.dataset.p);
  const dateVal=document.getElementById('nc-d').value;
  const timeVal=document.getElementById('nc-ti').value;
  const timeEnd=document.getElementById('nc-te').value;
  const newCard={id:'k'+Date.now(),gcal:selT==='gcal'?1:0,todo:selT==='todo'?1:0,
    type:document.getElementById('nc-s').value,title,addr:'',desc:document.getElementById('nc-desc').value,
    client:document.getElementById('nc-cl').value,date:dateVal,time:timeVal,
    price:parseInt(document.getElementById('nc-p').value)||0,
    team:team.length?team:['CD'],note:'',cl:[]};
  cols[ci].cards.push(newCard);
  // GCal létrehozás infó
  if(selT==='gcal'&&dateVal){
    const staffNames=team.map(p=>getStaff(p).name).join(', ');
    alert(`✓ Kártya létrehozva!

A Google Naptárba való mentéshez:
Menj a Naptár tabra és hozd létre az eseményt manuálisan.

Adatok:
📅 ${dateVal} ${timeVal} - ${timeEnd}
📍 ${title}
👤 ${staffNames}`);
  }
  document.getElementById('nc-t').value='';
  document.getElementById('nc-desc').value='';
  document.getElementById('nc-cl').value='';
  closeM('new-card');render();
}

// ── CLIENTS ────────────────────────────────────────────────────
function renderClients(){
  const el=document.getElementById('clients-list');
  if(!clientList.length){el.innerHTML='<div style="padding:24px;text-align:center;color:var(--t3)">Még nincs ügyfél felvéve</div>';return}
  el.innerHTML=`
    <div class="list-head">
      <div class="list-hd" style="flex:1">Cég neve</div>
      <div class="list-hd" style="width:180px">Email</div>
      <div class="list-hd" style="width:130px">Kapcsolattartó</div>
      <div class="list-hd" style="width:100px">Kategória</div>
      <div class="list-hd" style="width:60px"></div>
    </div>
    ${clientList.map(c=>`
      <div class="list-row" onclick="editClient('${c.id}')">
        <div style="flex:1">
          <div style="font-weight:700;font-size:13px">${c.name}</div>
          <div style="font-size:11px;color:var(--t3)">${c.addr||''}</div>
        </div>
        <div style="width:180px;font-size:12px;color:var(--t2)">${c.email||'—'}</div>
        <div style="width:130px;font-size:12px;color:var(--t2)">${c.cname||'—'}</div>
        <div style="width:100px"><span class="tag" style="background:var(--gdbg);color:var(--gold);font-size:10px">${c.cat}</span></div>
        <div style="width:60px;display:flex;gap:4px">
          <button class="btn btn-g" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation();editClient('${c.id}')">✏️</button>
        </div>
      </div>
    `).join('')}`;
}
function editClient(id){
  const c=clientList.find(x=>x.id===id);if(!c)return;
  editClientId=id;
  document.getElementById('client-modal-title').textContent='✏️ Ügyfél szerkesztése';
  document.getElementById('cl-name').value=c.name;
  document.getElementById('cl-addr').value=c.addr;
  document.getElementById('cl-email').value=c.email;
  document.getElementById('cl-tel').value=c.tel;
  document.getElementById('cl-vat').value=c.vat;
  document.getElementById('cl-cat').value=c.cat;
  document.getElementById('cl-cname').value=c.cname;
  document.getElementById('cl-cemail').value=c.cemail;
  document.getElementById('cl-ctel').value=c.ctel;
  openM('new-client');
}
function saveClient(){
  const name=document.getElementById('cl-name').value.trim();if(!name){alert('Cég neve kötelező!');return}
  const data={name,addr:document.getElementById('cl-addr').value,email:document.getElementById('cl-email').value,
    tel:document.getElementById('cl-tel').value,vat:document.getElementById('cl-vat').value,
    cat:document.getElementById('cl-cat').value,cname:document.getElementById('cl-cname').value,
    cemail:document.getElementById('cl-cemail').value,ctel:document.getElementById('cl-ctel').value};
  if(editClientId){Object.assign(clientList.find(c=>c.id===editClientId),data)}
  else{clientList.push({id:'c'+Date.now(),...data})}
  editClientId=null;
  ['cl-name','cl-addr','cl-email','cl-tel','cl-vat','cl-cname','cl-cemail','cl-ctel'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('client-modal-title').textContent='+ Új ügyfél';
  closeM('new-client');renderClients();
}

// ── STAFF ──────────────────────────────────────────────────────
function renderStaff(){
  const el=document.getElementById('staff-grid');
  el.innerHTML=staffList.map(s=>`
    <div class="staff-card" onclick="editStaff('${s.id}')">
      <div class="staff-avatar" style="background:${s.color}22">
        ${s.avatar?`<img src="${s.avatar}">`:`<span style="color:${s.color};font-size:22px;font-weight:700">${s.init}</span>`}
        <div class="staff-avatar-edit">✏️</div>
      </div>
      <div class="staff-name">${s.name}</div>
      <div class="staff-role">${s.role}</div>
      ${s.email?`<div class="staff-info"><span>📧</span><a href="mailto:${s.email}" style="color:var(--blue);text-decoration:none;font-size:11px" onclick="event.stopPropagation()">${s.email}</a></div>`:''}
      ${s.tel?`<div class="staff-info"><span>📞</span><span>${s.tel}</span></div>`:''}
      ${s.cal?`<div class="staff-info" style="margin-top:4px"><span class="gcal-tag">● GCal</span><span style="font-size:10px;color:var(--t3)">${s.cal}</span></div>`:''}
    </div>
  `).join('')+`
    <div class="staff-card" onclick="openM('new-staff')" style="border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:180px;cursor:pointer" id="add-staff-card">
      <div style="text-align:center;color:var(--t3)"><div style="font-size:32px;margin-bottom:6px">+</div><div style="font-size:13px;font-weight:600">Mitarbeiter hozzáadás</div></div>
    </div>`;
}
function editStaff(id){
  const s=staffList.find(x=>x.id===id);if(!s)return;
  editStaffId=id;staffAvatarData=s.avatar;
  document.getElementById('staff-modal-title').textContent='✏️ Mitarbeiter szerkesztése';
  document.getElementById('st-name').value=s.name;
  document.getElementById('st-init').value=s.init;
  document.getElementById('st-role').value=s.role;
  document.getElementById('st-email').value=s.email;
  document.getElementById('st-tel').value=s.tel;
  document.getElementById('st-cal').value=s.cal;
  document.getElementById('st-edit-id').value=id;
  document.getElementById('st-del-btn').style.display='inline-flex';
  const prev=document.getElementById('staff-av-preview');
  prev.innerHTML=s.avatar?`<img src="${s.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:'<span style="color:var(--t3);font-size:24px">📷</span>';
  openM('new-staff');
}
function previewStaffAvatar(inp){
  if(!inp.files[0])return;
  const reader=new FileReader();
  reader.onload=e=>{
    staffAvatarData=e.target.result;
    document.getElementById('staff-av-preview').innerHTML=`<img src="${staffAvatarData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  };
  reader.readAsDataURL(inp.files[0]);
}
function saveStaff(){
  const name=document.getElementById('st-name').value.trim();if(!name){alert('Név kötelező!');return}
  const data={name,init:document.getElementById('st-init').value||name.slice(0,2).toUpperCase(),
    role:document.getElementById('st-role').value,email:document.getElementById('st-email').value,
    tel:document.getElementById('st-tel').value,cal:document.getElementById('st-cal').value,
    color:scColor,avatar:staffAvatarData};
  if(editStaffId){Object.assign(staffList.find(s=>s.id===editStaffId),data)}
  else{staffList.push({id:'s'+Date.now(),...data})}
  editStaffId=null;staffAvatarData=null;
  document.getElementById('st-del-btn').style.display='none';
  document.getElementById('staff-modal-title').textContent='+ Mitarbeiter';
  ['st-name','st-init','st-email','st-tel','st-cal'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('staff-av-preview').innerHTML='<span style="color:var(--t3);font-size:24px">📷</span>';
  closeM('new-staff');renderStaff();renderStaffFilters();
}
function deleteStaff(){
  if(!editStaffId)return;
  if(!confirm('Biztosan törlöd ezt a Mitarbeitert?'))return;
  staffList=staffList.filter(s=>s.id!==editStaffId);
  editStaffId=null;
  document.getElementById('st-del-btn').style.display='none';
  closeM('new-staff');renderStaff();renderStaffFilters();
}
function pickSC(el,c){scColor=c;document.querySelectorAll('#staff-colpicks div').forEach(x=>x.style.outline='none');el.style.outline='3px solid var(--t1)';el.style.outlineOffset='2px'}

// ── STAFF FILTERS ──────────────────────────────────────────────
function renderStaffFilters(){
  const el=document.getElementById('staff-filters');
  el.innerHTML=staffList.filter(s=>s.cal||['CD','DB','EL'].includes(s.id)).map(s=>`
    <div class="chip" onclick="this.classList.toggle('on')" data-p="${s.id}" style="gap:5px">
      ${s.avatar?`<div class="av-xs" style="background:${s.color}22;color:${s.color}"><img src="${s.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`:`<div class="av-xs" style="background:${s.color}22;color:${s.color};font-size:8px;font-weight:700">${s.init}</div>`}
      <span>${s.name.split(' ')[0]}</span>
    </div>
  `).join('');
  // New card team selector
  const teamSel=document.getElementById('nc-team-sel');
  if(teamSel){
    teamSel.innerHTML=staffList.map(s=>`
      <div class="chip" data-p="${s.id}" onclick="this.classList.toggle('on')">
        <div class="av-xs" style="background:${s.color}22;color:${s.color}">${s.init}</div>
        ${s.name.split(' ')[0]}
      </div>
    `).join('');
  }
}

// ── MISC ───────────────────────────────────────────────────────
function addCol(){const n=document.getElementById('ncol-n').value.trim();if(!n)return;cols.push({id:'col'+Date.now(),title:n,dot:ncColor,cards:[]});document.getElementById('ncol-n').value='';closeM('new-col');render()}
function pickC(el,c){ncColor=c;document.querySelectorAll('#colpicks div').forEach(x=>x.style.outline='none');el.style.outline='3px solid var(--t1)';el.style.outlineOffset='2px'}
function quickAdd(ci){document.getElementById('nc-col').value=ci;openM('new-card')}
function renameCol(ci){const n=prompt('Oszlop neve:',cols[ci].title);if(n){cols[ci].title=n;render()}}
function syncGcal(){
  const el=document.getElementById('sync-txt');el.textContent='Szinkronizálás...';
  setTimeout(()=>{el.textContent='Szinkronizált ✓';setTimeout(()=>el.textContent='GCal szinkron',2500)},900);
}
function setView(v){
  document.getElementById('vb-b').style.cssText=v==='board'?'color:var(--gold);background:var(--gdbg)':'color:var(--t3);background:none';
  document.getElementById('vb-l').style.cssText=v==='list'?'color:var(--gold);background:var(--gdbg)':'color:var(--t3);background:none';
  const bw=document.getElementById('bwrap');
  if(v==='list'){
    bw.innerHTML=`<div style="max-width:760px;width:100%;padding:4px 0">${cols.map(col=>`<div style="margin-bottom:20px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:2px solid var(--border)"><div style="width:9px;height:9px;border-radius:50%;background:${col.dot}"></div><span style="font-weight:700;font-size:13px">${col.title}</span><span style="font-size:11px;font-weight:600;color:var(--t3);background:var(--bg3);padding:1px 6px;border-radius:4px">${col.cards.length}</span></div>${col.cards.map(c=>`<div style="display:flex;align-items:center;gap:11px;padding:9px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;box-shadow:var(--sh)"><span style="font-size:15px">${c.todo?'✓':(T[c.type]||T.foto).i}</span><div style="flex:1"><div style="font-size:13px;font-weight:600">${c.title}</div><div style="font-size:11px;color:var(--t3);margin-top:1px">${c.client||''}${c.date?' · '+fmtDate(c.date)+(c.time?' '+c.time:''):''}</div></div>${c.price?`<span style="font-size:12px;font-weight:700;color:var(--gold)">€${c.price}</span>`:''}</div>`).join('')||'<div style="font-size:12px;color:var(--t3);padding:5px 0">Nincs kártya</div>'}</div>`).join('')}</div>`;
  } else {bw.innerHTML='<div class="blayout" id="board"></div>';render()}
}
function navPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('act'));
  document.querySelectorAll('.tbn').forEach(x=>x.classList.remove('act'));
  document.getElementById('page-'+p).classList.add('act');
  document.getElementById('nav-'+p).classList.add('act');
  if(p==='clients')renderClients();
  if(p==='staff')renderStaff();
}
document.querySelectorAll('.mover').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));

// Init date
document.getElementById('nc-d').value=new Date().toISOString().slice(0,10);

// Init
renderStaffFilters();
render();
</script>
</body>
</html>
