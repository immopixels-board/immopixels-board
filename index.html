<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImmoPixels Board</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --bg2: #161b24;
  --bg3: #1c2333;
  --bg4: #222940;
  --col: #1a2035;
  --border: #2a3450;
  --border2: #344060;
  --gold: #d4a853;
  --gold2: #f0c878;
  --gd: #d4a85322;
  --blue: #5b9cf6;
  --green: #4cde8a;
  --red: #f97066;
  --yel: #f6c94e;
  --pur: #a78bfa;
  --t1: #e8edf5;
  --t2: #8b9bc0;
  --t3: #4a5572;
  --card-r: 10px;
  --col-w: 280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--t1);overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* TOPBAR */
.tb{height:50px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0;flex-shrink:0;z-index:200;position:relative}
.tb-logo{display:flex;align-items:center;gap:9px;padding:0 18px;border-right:1px solid var(--border);height:100%}
.lmark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#d4a853,#8a5e20);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:11px;color:#0f1117}
.tb-nav{display:flex;align-items:center;height:100%;padding:0 6px}
.tbn{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;font-size:13px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tbn:hover{color:var(--t2)}
.tbn.act{color:var(--gold);border-bottom-color:var(--gold)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 16px}
.sync-pill{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--green);font-family:'DM Mono',monospace;cursor:pointer}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ava{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8a5e20);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0f1117;cursor:pointer}

/* BOARD TOOLBAR */
.btb{height:44px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 16px;flex-shrink:0}
.bname{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;color:var(--t1);margin-right:4px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--gold);color:#0f1117;font-weight:600}.btn-p:hover{background:var(--gold2)}
.btn-g{background:none;border:1px solid var(--border2);color:var(--t2)}.btn-g:hover{border-color:var(--gold);color:var(--gold)}
.btn-ghost{background:none;border:none;color:var(--t3);padding:5px 8px}.btn-ghost:hover{color:var(--t2);background:var(--bg3)}
.divv{width:1px;height:20px;background:var(--border);margin:0 4px}
.filter-chip{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--t3);cursor:pointer}
.filter-chip.on{border-color:#d4a85355;background:var(--gd);color:var(--gold)}
.av-sm{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0}

/* BOARD */
.board-wrap{flex:1;overflow-x:auto;overflow-y:hidden;padding:16px;display:flex;gap:12px;align-items:flex-start}
.board-layout{display:flex;gap:12px;align-items:flex-start;min-height:100%;height:100%}

/* COLUMN */
.col{width:var(--col-w);min-width:var(--col-w);background:var(--col);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 114px);flex-shrink:0}
.col.drag-over{border-color:var(--gold);box-shadow:0 0 0 2px var(--gd)}
.col-head{padding:11px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0}
.col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.col-title{font-size:12px;font-weight:600;color:var(--t1);flex:1}
.col-count{background:var(--bg4);border-radius:4px;padding:1px 6px;font-size:10px;color:var(--t3);font-family:'DM Mono',monospace}
.col-menu{background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;padding:0 2px;line-height:1}
.col-body{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px;flex:1}
.col-add{padding:8px 10px;border-top:1px solid var(--border);flex-shrink:0}
.col-add-btn{width:100%;background:none;border:1px dashed var(--border2);border-radius:7px;padding:7px;font-size:12px;color:var(--t3);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.col-add-btn:hover{border-color:var(--gold);color:var(--gold)}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:11px 12px;cursor:grab;transition:all .15s;user-select:none;position:relative}
.card:hover{border-color:var(--border2);box-shadow:0 4px 16px #00000044;transform:translateY(-1px)}
.card:active{cursor:grabbing;opacity:.85}
.card.dragging{opacity:.4;border-style:dashed}
.card.gcal::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--blue);border-radius:var(--card-r) 0 0 var(--card-r)}
.card.todo::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--pur);border-radius:var(--card-r) 0 0 var(--card-r)}
.card-type{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.type-badge{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.gcal-tag{background:#5b9cf620;color:var(--blue);border:1px solid #5b9cf633;font-family:'DM Mono',monospace;font-size:9px;padding:1px 5px;border-radius:3px}
.card-title{font-size:13px;font-weight:600;color:var(--t1);line-height:1.35;margin-bottom:6px}
.card-addr{font-size:11px;color:var(--t3);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.card-date{font-size:10px;color:var(--t3);display:flex;align-items:center;gap:3px;font-family:'DM Mono',monospace}
.card-price{font-size:11px;font-weight:700;color:var(--gold);font-family:'DM Mono',monospace}
.card-avs{display:flex;margin-left:auto}
.card-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;border:2px solid var(--bg2);flex-shrink:0}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:1px 6px;border-radius:4px}
.todo-check{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;margin-right:6px;transition:all .15s}
.todo-check.done{background:var(--green);border-color:var(--green)}
.todo-title{font-size:13px;color:var(--t1);flex:1}
.todo-title.done{text-decoration:line-through;color:var(--t3)}

/* ADD COLUMN */
.add-col{width:240px;min-width:240px;background:var(--col);border:2px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:80px;transition:all .15s;flex-shrink:0}
.add-col:hover{border-color:var(--gold);background:var(--bg3)}
.add-col-inner{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--t3)}
.add-col:hover .add-col-inner{color:var(--gold)}

/* DETAIL DRAWER */
.drawer{position:fixed;top:0;right:-480px;width:460px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transition:right .25s ease;overflow:hidden}
.drawer.open{right:0}
.dr-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.dr-close{background:none;border:none;color:var(--t3);cursor:pointer;font-size:20px;padding:0;line-height:1}
.dr-body{flex:1;overflow-y:auto;padding:18px 20px}
.dr-section{margin-bottom:18px}
.dr-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.dr-val{font-size:13px;color:var(--t1)}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr-field{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.dr-fl{font-size:10px;color:var(--t3);margin-bottom:3px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.5px}
.dr-fv{font-size:13px;color:var(--t1);font-weight:600}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.st-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:none;color:var(--t3);font-family:inherit;transition:all .15s}
.st-btn.active{color:var(--t1)}
.checklist-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.checklist-item:last-child{border-bottom:none}
.dr-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.inp{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:7px 11px;font-size:13px;color:var(--t1);font-family:inherit;outline:none;width:100%}
.inp:focus{border-color:#d4a85355}

/* MODAL */
.mover{position:fixed;inset:0;background:#00000099;z-index:400;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.mover.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:24px;width:480px;max-width:95vw}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;margin-bottom:18px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lbl{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:block}

/* OVERLAY when drawer open */
.overlay{position:fixed;inset:0;z-index:250;display:none}
.overlay.on{display:block}
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh">

<!-- TOPBAR -->
<div class="tb">
  <div class="tb-logo">
    <div class="lmark">IP</div>
    <span style="font-family:'Syne',sans-serif;font-weight:700;font-size:14px">ImmoPixels</span>
  </div>
  <div class="tb-nav">
    <div class="tbn">Spaces</div>
    <div class="tbn act">📋 Board</div>
    <div class="tbn">📅 Naptár</div>
    <div class="tbn">📊 Riportok</div>
    <div class="tbn">⚙ Beállítások</div>
  </div>
  <div class="tb-r">
    <div class="sync-pill" onclick="syncGcal()">
      <span class="sync-dot"></span>
      <span id="sync-txt">GCal szinkron</span>
    </div>
    <div class="ava">CD</div>
  </div>
</div>

<!-- BOARD TOOLBAR -->
<div class="btb">
  <span class="bname">ImmoPixels Board</span>
  <div class="divv"></div>
  <button class="btn btn-p" onclick="openModal('new-card')">+ Új kártya</button>
  <button class="btn btn-g" onclick="openModal('new-col')">+ Oszlop</button>
  <div class="divv"></div>
  <div class="filter-chip on" onclick="this.classList.toggle('on')">
    <span class="sync-dot" style="background:var(--blue)"></span> GCal job-ok
  </div>
  <div class="filter-chip on" onclick="this.classList.toggle('on')">
    <span class="sync-dot" style="background:var(--pur)"></span> Saját todo
  </div>
  <div class="filter-chip" onclick="this.classList.toggle('on')">📷 Fotó</div>
  <div class="filter-chip" onclick="this.classList.toggle('on')">🎞️ Reel</div>
  <div class="filter-chip" onclick="this.classList.toggle('on')">🚁 Drón</div>
  <div class="divv"></div>
  <div class="filter-chip" onclick="this.classList.toggle('on')">
    <div class="av-sm" style="background:#d4a85333;color:var(--gold)">CD</div> Cristian
  </div>
  <div class="filter-chip" onclick="this.classList.toggle('on')">
    <div class="av-sm" style="background:#5b9cf622;color:var(--blue)">DB</div> Daniel
  </div>
  <div class="filter-chip" onclick="this.classList.toggle('on')">
    <div class="av-sm" style="background:#4cde8a22;color:var(--green)">EL</div> Elias
  </div>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button class="btn-ghost btn" onclick="toggleView('board')" id="vbtn-board" style="color:var(--gold)">⊞ Board</button>
    <button class="btn-ghost btn" onclick="toggleView('list')" id="vbtn-list">☰ Lista</button>
  </div>
</div>

<!-- BOARD -->
<div class="board-wrap" id="board-wrap">
  <div class="board-layout" id="board"></div>
</div>

<!-- CARD DETAIL DRAWER -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dr-head">
    <div>
      <div id="dr-type" style="margin-bottom:6px"></div>
      <div id="dr-title" style="font-family:'Syne',sans-serif;font-weight:700;font-size:17px;color:var(--t1)"></div>
    </div>
    <button class="dr-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="dr-body">
    <div class="dr-section">
      <div class="dr-label">Státusz</div>
      <div class="status-row" id="dr-status-row"></div>
    </div>
    <div class="dr-grid" style="margin-bottom:18px" id="dr-fields"></div>
    <div class="dr-section" id="dr-checklist-wrap">
      <div class="dr-label">Checklist</div>
      <div id="dr-checklist"></div>
      <div style="display:flex;gap:7px;margin-top:8px">
        <input class="inp" id="cl-inp" placeholder="+ Elem hozzáadása..." style="font-size:12px;padding:6px 10px">
        <button class="btn btn-g" style="padding:5px 10px;font-size:12px" onclick="addCheckItem()">+</button>
      </div>
    </div>
    <div class="dr-section">
      <div class="dr-label">Megjegyzés</div>
      <textarea class="inp" rows="3" placeholder="Megjegyzés..." style="resize:none;font-size:12px" id="dr-note"></textarea>
    </div>
  </div>
  <div class="dr-foot">
    <button class="btn btn-p" style="flex:1;justify-content:center" onclick="closeDrawer()">✓ Mentés</button>
    <button class="btn btn-g" onclick="moveToNext()">→ Következő státusz</button>
    <button class="btn btn-g" style="color:var(--red);border-color:#f9706633" onclick="deleteCard()">🗑</button>
  </div>
</div>

<!-- MODAL: ÚJ KÁRTYA -->
<div class="mover" id="modal-new-card">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <span class="modal-title" style="margin:0">+ Új kártya</span>
      <button style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px" onclick="closeModal('new-card')">✕</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-g" id="type-gcal" onclick="setCardType('gcal')" style="color:var(--blue);border-color:#5b9cf633">📅 GCal job</button>
      <button class="btn btn-g" id="type-todo" onclick="setCardType('todo')" style="color:var(--pur);border-color:#a78bfa33">✓ Todo</button>
      <button class="btn btn-g" id="type-manual" onclick="setCardType('manual')">📷 Manuális job</button>
    </div>
    <div class="fg">
      <div style="grid-column:1/-1"><label class="lbl">Cím</label><input class="inp" id="nc-title" placeholder="pl. Heidelberger Str. 12, Mannheim"></div>
    </div>
    <div class="fg">
      <div><label class="lbl">Dátum</label><input class="inp" type="date" id="nc-date" value="2026-05-20"></div>
      <div><label class="lbl">Időpont</label><input class="inp" type="time" id="nc-time" value="10:00"></div>
    </div>
    <div class="fg">
      <div><label class="lbl">Szolgáltatás</label>
        <select class="inp" id="nc-type">
          <option value="foto">📷 Fotó alap</option>
          <option value="video">🎬 Videó</option>
          <option value="dron">🚁 Drón</option>
          <option value="reel">🎞️ ImmoReels</option>
          <option value="foto-dron">📷🚁 Fotó + Drón</option>
        </select>
      </div>
      <div><label class="lbl">Ár (€)</label><input class="inp" type="number" id="nc-price" placeholder="280"></div>
    </div>
    <div style="margin-bottom:12px"><label class="lbl">Ügyfél</label>
      <select class="inp" id="nc-client">
        <option>RE/MAX Mannheim</option>
        <option>Engel & Völkers</option>
        <option>Müller Immobilien</option>
        <option>Volksbank Immobilien</option>
        <option>Sparkasse Immo</option>
        <option>+ Új ügyfél</option>
      </select>
    </div>
    <div style="margin-bottom:12px"><label class="lbl">Csapat</label>
      <div style="display:flex;gap:6px" id="nc-team">
        <div class="filter-chip on" data-person="CD" onclick="togglePerson(this)"><div class="av-sm" style="background:#d4a85333;color:var(--gold)">CD</div> Cristian</div>
        <div class="filter-chip" data-person="DB" onclick="togglePerson(this)"><div class="av-sm" style="background:#5b9cf622;color:var(--blue)">DB</div> Daniel</div>
        <div class="filter-chip" data-person="EL" onclick="togglePerson(this)"><div class="av-sm" style="background:#4cde8a22;color:var(--green)">EL</div> Elias</div>
      </div>
    </div>
    <div style="margin-bottom:16px"><label class="lbl">Oszlop</label>
      <select class="inp" id="nc-col">
        <option value="0">📥 Beérkező</option>
        <option value="1">✓ Visszaigazolt</option>
        <option value="2">📷 Elvégzés alatt</option>
        <option value="3">📦 Leadás</option>
        <option value="4">💶 Számlázás</option>
        <option value="5">✅ Kész</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-g" onclick="closeModal('new-card')">Mégsem</button>
      <button class="btn btn-p" onclick="createCard()">+ Létrehozás</button>
    </div>
  </div>
</div>

<!-- MODAL: ÚJ OSZLOP -->
<div class="mover" id="modal-new-col">
  <div class="modal" style="width:340px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <span class="modal-title" style="margin:0">+ Új oszlop</span>
      <button style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px" onclick="closeModal('new-col')">✕</button>
    </div>
    <div style="margin-bottom:12px"><label class="lbl">Oszlop neve</label><input class="inp" id="new-col-name" placeholder="pl. Minőségellenőrzés"></div>
    <div style="margin-bottom:16px"><label class="lbl">Szín</label>
      <div style="display:flex;gap:8px;margin-top:4px">
        <div style="width:24px;height:24px;border-radius:50%;background:#5b9cf6;cursor:pointer;border:2px solid transparent" onclick="selColor(this,'#5b9cf6')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#d4a853;cursor:pointer;border:2px solid transparent" onclick="selColor(this,'#d4a853')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#4cde8a;cursor:pointer;border:2px solid transparent" onclick="selColor(this,'#4cde8a')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#a78bfa;cursor:pointer;border:2px solid transparent" onclick="selColor(this,'#a78bfa')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#f97066;cursor:pointer;border:2px solid transparent" onclick="selColor(this,'#f97066')"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:#f6c94e;cursor:pointer;border:2px solid transparent" onclick="selColor(this,'#f6c94e')"></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-g" onclick="closeModal('new-col')">Mégsem</button>
      <button class="btn btn-p" onclick="addColumn()">+ Oszlop létrehozás</button>
    </div>
  </div>
</div>

<script>
// ─── DATA ──────────────────────────────────────────────
const TEAM_COLORS = {CD:'#d4a85333',DB:'#5b9cf622',EL:'#4cde8a22'};
const TEAM_TEXT   = {CD:'var(--gold)',DB:'var(--blue)',EL:'var(--green)'};
const TYPE_MAP    = {foto:{icon:'📷',label:'Fotó',color:'#d4a853'},video:{icon:'🎬',label:'Videó',color:'#5b9cf6'},dron:{icon:'🚁',label:'Drón',color:'#4cde8a'},reel:{icon:'🎞️',label:'Reel',color:'#a78bfa'},'foto-dron':{icon:'📷🚁',label:'F+D',color:'#f6c94e'}};

let newColColor = '#5b9cf6';
let activeCard  = null;
let dragCard    = null;
let dragFromCol = null;

const cols = [
  {id:'beerkező', title:'📥 Beérkező', dot:'#8b9bc0', cards:[
    {id:'c1',gcal:true,type:'foto',title:'Heidelberger Str. 12',addr:'Mannheim',client:'RE/MAX',date:'05-13',time:'09:30',price:280,team:['CD'],note:'',checklist:[{t:'Kamera csekk',d:false},{t:'Drón engedély',d:false}]},
    {id:'c2',gcal:true,type:'reel',title:'Parkring 5',addr:'Ludwigshafen',client:'Engel & Völkers',date:'05-13',time:'11:00',price:520,team:['DB','CD'],note:'',checklist:[]},
  ]},
  {id:'visszaigazolt', title:'✓ Visszaigazolt', dot:'#5b9cf6', cards:[
    {id:'c3',gcal:true,type:'foto',title:'Seckenheimer Landstr. 55',addr:'Mannheim',client:'Volksbank',date:'05-13',time:'16:30',price:260,team:['CD'],note:'',checklist:[]},
    {id:'c4',gcal:true,type:'dron',title:'Winzerstr. 8 — Neustadt',addr:'Neustadt a.d.W.',client:'Müller Immo',date:'05-14',time:'14:00',price:480,team:['CD','EL'],note:'Drón üzemanyag',checklist:[{t:'Repülési engedély',d:true},{t:'Időjárás check',d:false}]},
    {id:'ct1',todo:true,title:'Sandra Kleinnek árlistát küldeni',addr:'',client:'RE/MAX',date:'05-13',time:'',price:0,team:['CD'],note:'',checklist:[]},
  ]},
  {id:'elvegzes', title:'📷 Elvégzés alatt', dot:'#f6c94e', cards:[
    {id:'c5',gcal:true,type:'foto',title:'Käfertaler Str. 190',addr:'Mannheim',client:'Schmidt (privát)',date:'05-09',time:'15:00',price:220,team:['CD'],note:'Parkolás az udvarban',checklist:[{t:'RAW fájlok mentés',d:true},{t:'Szerkesztés',d:false}]},
  ]},
  {id:'leadás', title:'📦 Leadás', dot:'#a78bfa', cards:[
    {id:'c6',gcal:true,type:'reel',title:'Friedrichsplatz 8',addr:'Mannheim',client:'Volksbank',date:'05-10',time:'11:00',price:350,team:['DB'],note:'',checklist:[{t:'Drive link generálás',d:true},{t:'Email küldés ügyfélnek',d:false}]},
  ]},
  {id:'szamlazas', title:'💶 Számlázás', dot:'#f97066', cards:[
    {id:'c7',gcal:true,type:'foto',title:'Schillerstr. 18',addr:'Heidelberg',client:'Engel & Völkers',date:'05-07',time:'10:00',price:280,team:['CD'],note:'',checklist:[]},
    {id:'ct2',todo:true,title:'Müller #039 késedelmes számla emlékeztető',addr:'',client:'Müller Immo',date:'05-12',time:'',price:0,team:['NS'],note:'',checklist:[]},
  ]},
  {id:'kesz', title:'✅ Kész', dot:'#4cde8a', cards:[
    {id:'c8',gcal:true,type:'foto',title:'Rheinuferstr. 22',addr:'Mannheim',client:'RE/MAX',date:'05-06',time:'09:00',price:280,team:['CD'],note:'',checklist:[{t:'Képek elkészültek',d:true},{t:'Email elküldve',d:true},{t:'Kiszámlázva',d:true}]},
    {id:'c9',gcal:true,type:'video',title:'Tattersallstr. 1',addr:'Mannheim',client:'Sparkasse',date:'05-04',time:'13:00',price:350,team:['DB'],note:'',checklist:[{t:'Vágás',d:true},{t:'Elküldve',d:true}]},
  ]},
];

// ─── RENDER ────────────────────────────────────────────
function renderBoard() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  cols.forEach((col, ci) => {
    const el = document.createElement('div');
    el.className = 'col';
    el.dataset.colidx = ci;
    el.innerHTML = `
      <div class="col-head">
        <div class="col-dot" style="background:${col.dot}"></div>
        <div class="col-title">${col.title}</div>
        <div class="col-count">${col.cards.length}</div>
        <button class="col-menu" onclick="colMenu(${ci})">⋯</button>
      </div>
      <div class="col-body" id="colbody-${ci}"></div>
      <div class="col-add"><button class="col-add-btn" onclick="quickAdd(${ci})">+ Kártya hozzáadás</button></div>
    `;
    b.appendChild(el);
    const body = document.getElementById(`colbody-${ci}`);
    col.cards.forEach((card, ki) => {
      body.appendChild(makeCard(card, ci, ki));
    });
    // drag-over events on col-body
    body.addEventListener('dragover', e => {
      e.preventDefault();
      el.classList.add('drag-over');
    });
    body.addEventListener('dragleave', e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
    });
    body.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      if (dragCard === null || dragFromCol === null) return;
      if (dragFromCol === ci) return;
      const card = cols[dragFromCol].cards.splice(dragCard, 1)[0];
      cols[ci].cards.push(card);
      renderBoard();
    });
  });
  // Add column button
  const addEl = document.createElement('div');
  addEl.className = 'add-col';
  addEl.onclick = () => openModal('new-col');
  addEl.innerHTML = `<div class="add-col-inner"><span style="font-size:18px">+</span><span>Oszlop hozzáadása</span></div>`;
  b.appendChild(addEl);
}

function makeCard(card, ci, ki) {
  const el = document.createElement('div');
  el.className = 'card' + (card.gcal ? ' gcal' : '') + (card.todo ? ' todo' : '');
  el.draggable = true;
  el.dataset.ci = ci;
  el.dataset.ki = ki;

  const t = TYPE_MAP[card.type] || {};
  const doneChecks = card.checklist.filter(x=>x.d).length;

  if (card.todo) {
    el.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div class="todo-check ${card.checklist.length && doneChecks===card.checklist.length?'done':''}" onclick="event.stopPropagation();toggleTodo(${ci},${ki})">
          ${doneChecks===card.checklist.length&&card.checklist.length?'<svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 4l2 2 4-4" stroke="white" stroke-width="1.5" fill="none"/></svg>':''}
        </div>
        <div style="flex:1">
          <div class="todo-title ${doneChecks===card.checklist.length&&card.checklist.length?'done':''}">${card.title}</div>
          <div class="card-meta" style="margin-top:5px">
            ${card.date?`<div class="card-date">📅 ${card.date}</div>`:''}
            <div class="card-av" style="background:${TEAM_COLORS[card.team[0]]||'#333'};color:${TEAM_TEXT[card.team[0]]||'#fff'};margin-left:auto">${card.team[0]}</div>
          </div>
        </div>
      </div>
      <div style="position:absolute;top:8px;right:8px;background:var(--pd,#a78bfa22);border-radius:3px;padding:1px 5px;font-size:9px;color:var(--pur)">TODO</div>
    `;
  } else {
    el.innerHTML = `
      <div class="card-type">
        <span class="type-badge" style="background:${t.color}22;color:${t.color};border:1px solid ${t.color}33">${t.icon||'📷'} ${t.label||'Fotó'}</span>
        ${card.gcal?'<span class="gcal-tag">● GCal</span>':''}
        ${card.checklist.length?`<span style="margin-left:auto;font-size:10px;color:${doneChecks===card.checklist.length?'var(--green)':'var(--t3)'};font-family:'DM Mono',monospace">✓ ${doneChecks}/${card.checklist.length}</span>`:''}
      </div>
      <div class="card-title">${card.title}</div>
      ${card.addr?`<div class="card-addr"><span style="font-size:11px">📍</span>${card.addr} · ${card.client}</div>`:''}
      <div class="card-meta">
        ${card.date?`<div class="card-date">📅 ${card.date}${card.time?' '+card.time:''}</div>`:''}
        ${card.price?`<div class="card-price">€${card.price}</div>`:''}
        <div class="card-avs">
          ${card.team.map((p,i)=>`<div class="card-av" style="background:${TEAM_COLORS[p]||'#333'};color:${TEAM_TEXT[p]||'#fff'};margin-left:${i?'-6px':'0'}">${p}</div>`).join('')}
        </div>
      </div>
    `;
  }

  el.addEventListener('click', () => openDrawer(card, ci, ki));
  el.addEventListener('dragstart', e => {
    dragCard = ki;
    dragFromCol = ci;
    setTimeout(() => el.classList.add('dragging'), 0);
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    dragCard = null;
    dragFromCol = null;
    document.querySelectorAll('.col').forEach(c => c.classList.remove('drag-over'));
  });
  return el;
}

// ─── DRAWER ────────────────────────────────────────────
function openDrawer(card, ci, ki) {
  activeCard = {card, ci, ki};
  const t = TYPE_MAP[card.type] || {};
  document.getElementById('dr-type').innerHTML = card.todo
    ? '<span style="background:#a78bfa22;color:var(--pur);border:1px solid #a78bfa33;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">TODO</span>'
    : `<span class="type-badge" style="background:${t.color||'#d4a853'}22;color:${t.color||'var(--gold)'};border:1px solid ${t.color||'#d4a853'}33">${t.icon||'📷'} ${t.label||'Fotó'}</span>${card.gcal?'<span class="gcal-tag" style="margin-left:6px">● GCal</span>':''}`;
  document.getElementById('dr-title').textContent = card.title;

  // Status buttons
  const statuses = ['📥 Beérkező','✓ Visszaigazolt','📷 Elvégzés','📦 Leadás','💶 Számlázás','✅ Kész'];
  document.getElementById('dr-status-row').innerHTML = cols.map((c,i) =>
    `<button class="st-btn ${i===ci?'active':''}" style="${i===ci?`background:${c.dot}33;color:${c.dot};border-color:${c.dot}55`:''}" onclick="moveCardTo(${i})">${c.title}</button>`
  ).join('');

  // Fields
  const fields = [];
  if (!card.todo) {
    if (card.client) fields.push({l:'Ügyfél',v:card.client});
    if (card.date)   fields.push({l:'Dátum',v:card.date+(card.time?' '+card.time:'')});
    if (card.addr)   fields.push({l:'Helyszín',v:card.addr});
    if (card.price)  fields.push({l:'Ár',v:`€${card.price}`});
    fields.push({l:'Csapat',v:card.team.map(p=>`<div class="av-sm" style="background:${TEAM_COLORS[p]};color:${TEAM_TEXT[p]};display:inline-flex;margin-right:3px;border-radius:50%;width:20px;height:20px;align-items:center;justify-content:center;font-size:8px;font-weight:700">${p}</div>`).join('')});
  } else {
    if (card.date)   fields.push({l:'Határidő',v:card.date});
    if (card.client) fields.push({l:'Kapcsolódó',v:card.client});
  }
  document.getElementById('dr-fields').innerHTML = fields.map(f=>`<div class="dr-field"><div class="dr-fl">${f.l}</div><div class="dr-fv">${f.v}</div></div>`).join('');

  // Checklist
  renderChecklist(card);
  document.getElementById('dr-note').value = card.note || '';

  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('on');
}

function renderChecklist(card) {
  document.getElementById('dr-checklist').innerHTML = card.checklist.map((item,i)=>`
    <div class="checklist-item">
      <div class="todo-check ${item.d?'done':''}" onclick="toggleCheck(${i})">
        ${item.d?'<svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 4l2 2 4-4" stroke="white" stroke-width="1.5" fill="none"/></svg>':''}
      </div>
      <span style="flex:1;font-size:13px;color:${item.d?'var(--t3)':'var(--t1)'};text-decoration:${item.d?'line-through':'none'}">${item.t}</span>
      <button onclick="removeCheck(${i})" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px">×</button>
    </div>
  `).join('');
}

function toggleCheck(i) {
  if (!activeCard) return;
  activeCard.card.checklist[i].d = !activeCard.card.checklist[i].d;
  renderChecklist(activeCard.card);
  renderBoard();
}
function removeCheck(i) {
  if (!activeCard) return;
  activeCard.card.checklist.splice(i, 1);
  renderChecklist(activeCard.card);
}
function addCheckItem() {
  if (!activeCard) return;
  const inp = document.getElementById('cl-inp');
  if (!inp.value.trim()) return;
  activeCard.card.checklist.push({t: inp.value.trim(), d: false});
  inp.value = '';
  renderChecklist(activeCard.card);
}
function moveCardTo(targetCol) {
  if (!activeCard) return;
  const {card, ci, ki} = activeCard;
  cols[ci].cards.splice(ki, 1);
  cols[targetCol].cards.push(card);
  closeDrawer();
  renderBoard();
}
function moveToNext() {
  if (!activeCard) return;
  const next = Math.min(activeCard.ci + 1, cols.length - 1);
  moveCardTo(next);
}
function deleteCard() {
  if (!activeCard) return;
  cols[activeCard.ci].cards.splice(activeCard.ki, 1);
  closeDrawer();
  renderBoard();
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
  activeCard = null;
}

// ─── MODALS ────────────────────────────────────────────
function openModal(id) { document.getElementById('modal-'+id).classList.add('open'); }
function closeModal(id) { document.getElementById('modal-'+id).classList.remove('open'); }

let selectedCardType = 'gcal';
function setCardType(t) {
  selectedCardType = t;
  ['gcal','todo','manual'].forEach(x => {
    const b = document.getElementById('type-'+x);
    if (b) b.style.opacity = x===t ? '1' : '.5';
  });
}
setCardType('gcal');

function togglePerson(el) { el.classList.toggle('on'); }

function createCard() {
  const title = document.getElementById('nc-title').value.trim();
  if (!title) { alert('Adj meg egy nevet!'); return; }
  const colIdx = parseInt(document.getElementById('nc-col').value);
  const team = [...document.querySelectorAll('#nc-team .filter-chip.on')].map(x=>x.dataset.person);
  const newCard = {
    id: 'c'+Date.now(),
    gcal: selectedCardType==='gcal',
    todo: selectedCardType==='todo',
    type: document.getElementById('nc-type').value,
    title,
    addr: '',
    client: document.getElementById('nc-client').value,
    date: document.getElementById('nc-date').value.slice(5),
    time: document.getElementById('nc-time').value,
    price: parseInt(document.getElementById('nc-price').value)||0,
    team: team.length ? team : ['CD'],
    note: '',
    checklist: [],
  };
  cols[colIdx].cards.push(newCard);
  closeModal('new-card');
  renderBoard();
}

function addColumn() {
  const name = document.getElementById('new-col-name').value.trim();
  if (!name) return;
  cols.push({id:'col'+Date.now(), title:name, dot:newColColor, cards:[]});
  closeModal('new-col');
  renderBoard();
}

function selColor(el, color) {
  newColColor = color;
  document.querySelectorAll('#modal-new-col [onclick^="selColor"]').forEach(x => x.style.border='2px solid transparent');
  el.style.border = '2px solid white';
}

function quickAdd(ci) {
  document.getElementById('nc-col').value = ci;
  openModal('new-card');
}

function colMenu(ci) {
  const name = prompt('Oszlop neve:', cols[ci].title);
  if (name) { cols[ci].title = name; renderBoard(); }
}

function toggleTodo(ci, ki) {
  const card = cols[ci].cards[ki];
  if (!card.checklist.length) {
    card.checklist = [{t: card.title, d: false}];
    card.checklist[0].d = true;
  }
  renderBoard();
}

// ─── GCAL SYNC ────────────────────────────────────────
function syncGcal() {
  const el = document.getElementById('sync-txt');
  el.textContent = 'Szinkronizálás...';
  setTimeout(() => {
    // Add a mock new card
    const exists = cols[0].cards.find(c => c.id === 'c_new');
    if (!exists) {
      cols[0].cards.unshift({
        id: 'c_new', gcal: true, type: 'foto',
        title: 'Neumannstr. 42 — új import',
        addr: 'Mannheim', client: 'RE/MAX',
        date: '05-20', time: '10:00', price: 280,
        team: ['CD'], note: '', checklist: [],
      });
      renderBoard();
    }
    el.textContent = 'Szinkronizált ✓';
    setTimeout(() => { el.textContent = 'GCal szinkron'; }, 2000);
  }, 1200);
}

// ─── VIEW TOGGLE ──────────────────────────────────────
function toggleView(v) {
  document.getElementById('vbtn-board').style.color = v==='board'?'var(--gold)':'var(--t3)';
  document.getElementById('vbtn-list').style.color  = v==='list'?'var(--gold)':'var(--t3)';
  const bw = document.getElementById('board-wrap');
  if (v==='list') {
    // Simple list fallback
    bw.innerHTML = `<div style="max-width:720px;width:100%">${cols.map(col=>`
      <div style="margin-bottom:20px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">
          <div style="width:8px;height:8px;border-radius:50%;background:${col.dot}"></div>
          <span style="font-weight:600;font-size:14px">${col.title}</span>
          <span style="font-size:11px;color:var(--t3);font-family:'DM Mono',monospace">${col.cards.length}</span>
        </div>
        ${col.cards.map(card=>`
          <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer">
            <div style="font-size:15px">${card.todo?'✓':(TYPE_MAP[card.type]||{icon:'📷'}).icon}</div>
            <div style="flex:1"><div style="font-size:13px;font-weight:600">${card.title}</div><div style="font-size:11px;color:var(--t3)">${card.client||''}${card.date?' · '+card.date:''}</div></div>
            ${card.price?`<div style="font-size:12px;font-weight:700;color:var(--gold);font-family:'DM Mono',monospace">€${card.price}</div>`:''}
            <div style="display:flex">${card.team.map(p=>`<div style="width:22px;height:22px;border-radius:50%;background:${TEAM_COLORS[p]};color:${TEAM_TEXT[p]};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700">${p}</div>`).join('')}</div>
          </div>
        `).join('')}
      </div>
    `).join('')}</div>`;
  } else {
    bw.innerHTML = '<div class="board-layout" id="board"></div>';
    renderBoard();
  }
}

// close modals on overlay click
document.querySelectorAll('.mover').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));

// ─── INIT ─────────────────────────────────────────────
renderBoard();
</script>
</body>
</html>
